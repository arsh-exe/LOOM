<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — LOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <div class="form-card">
    <h2 style="text-align:center;">Create your account</h2>
    <p class="text-center text-muted" style="margin-bottom:var(--space-5);">Join LOOM in seconds</p>
    <form id="register-form">
      <div class="field"><label>Full Name</label><input type="text" id="register-name" required /></div>
      <div class="field"><label>Email</label><input type="email" id="register-email" required /></div>
      <div class="field"><label>Password</label><input type="password" id="register-password" minlength="6" required /></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="register-confirm" minlength="6" required /></div>
      <div id="register-error" class="field-error"></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="text-center text-muted" style="margin-top:var(--space-4); font-size:0.88rem;">
      Already have an account? <a href="login.html" class="text-link">Log in</a>
    </p>
  </div>

  <div id="toast-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/auth-pages.js"></script>
</body>
</html>
