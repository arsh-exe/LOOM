<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — LOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/home.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <section class="section">
    <div class="container">
      <h1 style="font-size:2rem; margin-bottom:var(--space-6);">Checkout</h1>
      <form id="checkout-form" class="checkout-layout">
        <div>
          <div class="card" style="padding:var(--space-6); margin-bottom:var(--space-5);">
            <h3>Shipping Address</h3>
            <div class="field"><label>Street Address</label><input id="addr-street" required /></div>
            <div class="field-row">
              <div class="field"><label>City</label><input id="addr-city" required /></div>
              <div class="field"><label>State</label><input id="addr-state" required /></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Postal Code</label><input id="addr-postal" required /></div>
              <div class="field"><label>Country</label><input id="addr-country" required /></div>
            </div>
          </div>

          <div class="card" style="padding:var(--space-6);">
            <h3>Payment Method</h3>
            <label class="radio-option"><input type="radio" name="payment" value="Cash on Delivery" checked /> Cash on Delivery</label>
            <label class="radio-option"><input type="radio" name="payment" value="Card (Demo)" /> Card (Demo — no real payment processed)</label>
          </div>
        </div>

        <div class="card summary-card">
          <h3>Order Summary</h3>
          <div id="checkout-summary"><div class="spinner"></div></div>
          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn" style="margin-top:var(--space-4);">Place Order</button>
        </div>
      </form>
    </div>
  </section>

  <div id="footer-mount"></div>
  <div id="ai-search-mount"></div>
  <div id="ai-chat-mount"></div>
  <div id="toast-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
