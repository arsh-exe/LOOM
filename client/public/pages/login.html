<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — LOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="navbar-mount"></div>
  <div id="ai-search-mount"></div>

  <div class="form-card">
    <h2 style="text-align:center;">Welcome back</h2>
    <p class="text-center text-muted" style="margin-bottom:var(--space-5);">Log in to your LOOM account</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required /></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required /></div>
      <div id="login-error" class="field-error"></div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <p class="text-center text-muted" style="margin-top:var(--space-4); font-size:0.88rem;">
      Don't have an account? <a href="register.html" class="text-link">Register</a>
    </p>
    <p class="text-center text-muted" style="margin-top:var(--space-3); font-size:0.78rem;">
      Demo: admin@example.com / admin123 · user@example.com / user1234
    </p>
  </div>

  <div id="toast-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/auth-pages.js"></script>
</body>
</html>
