<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — LOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <section class="section">
    <div class="container" style="max-width:600px;">
      <h1 style="font-size:2rem; margin-bottom:var(--space-6);">My Profile</h1>
      <form id="profile-form" class="card" style="padding:var(--space-6);">
        <div class="field"><label>Full Name</label><input id="profile-name" required /></div>
        <div class="field"><label>Email</label><input id="profile-email" disabled /></div>
        <h3 style="margin-top:var(--space-5);">Shipping Address</h3>
        <div class="field"><label>Street</label><input id="profile-street" /></div>
        <div class="field-row">
          <div class="field"><label>City</label><input id="profile-city" /></div>
          <div class="field"><label>State</label><input id="profile-state" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Postal Code</label><input id="profile-postal" /></div>
          <div class="field"><label>Country</label><input id="profile-country" /></div>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </section>

  <div id="footer-mount"></div>
  <div id="ai-search-mount"></div>
  <div id="ai-chat-mount"></div>
  <div id="toast-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
