<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — LOOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/home.css" />
  <link rel="stylesheet" href="../css/product.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="navbar-mount"></div>

  <section class="section" style="padding-bottom:0;">
    <div class="container">
      <h1 style="font-size:2rem;">Shop All Products</h1>
    </div>
  </section>

  <section class="section">
    <div class="container" style="display:grid; grid-template-columns:240px 1fr; gap:var(--space-6); align-items:start;">
      <!-- Filters sidebar -->
      <form id="filter-form" class="card" style="padding:var(--space-5);">
        <div class="field">
          <label>Search</label>
          <input type="text" id="filter-keyword" placeholder="Name or brand..." />
        </div>
        <div class="field">
          <label>Category</label>
          <select id="filter-category"><option value="">All categories</option></select>
        </div>
        <div class="field">
          <label>Price range</label>
          <div class="flex gap-2">
            <input type="number" id="filter-min-price" placeholder="Min" />
            <input type="number" id="filter-max-price" placeholder="Max" />
          </div>
        </div>
        <div class="field">
          <label>Minimum rating</label>
          <select id="filter-min-rating">
            <option value="">Any</option>
            <option value="4">4★ & up</option>
            <option value="3">3★ & up</option>
            <option value="2">2★ & up</option>
          </select>
        </div>
        <div class="field">
          <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
            <input type="checkbox" id="filter-in-stock" style="width:auto;" /> In stock only
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Apply Filters</button>
        <button type="button" id="clear-filters" class="btn btn-ghost btn-block" style="margin-top:8px;">Clear all</button>
      </form>

      <!-- Results -->
      <div>
        <div class="flex-between" style="margin-bottom:var(--space-4);">
          <span id="results-info" class="text-muted" style="font-size:0.88rem;"></span>
          <select id="sort-select" style="width:auto; padding:8px 12px; border:1px solid var(--color-border); border-radius:var(--radius-sm); font-family:var(--font-body);">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>
        <div class="product-grid" id="product-grid"></div>
        <div class="flex gap-2" style="justify-content:center; margin-top:var(--space-6);" id="pagination"></div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>
  <div id="ai-chat-mount"></div>
  <div id="toast-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/shop.js"></script>
</body>
</html>
